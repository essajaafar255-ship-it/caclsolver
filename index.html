<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }
        #access-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
        }
        .input-panel {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="password"] {
            padding: 10px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #error-msg {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 14px;
            height: 18px;
        }
        #display-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            justify-content: center;
            align-items: center;
        }
        #thumbnail {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="access-container">
        <div class="input-panel">
            <h2>System Authentication</h2>
            <p style="margin-bottom: 15px; color: #aaa;">Enter terminal passkey to proceed</p>
            <input type="password" id="passkey" placeholder="••••" maxlength="4">
            <br>
            <button onclick="verifyCode()">Initialize</button>
            <div id="error-msg"></div>
        </div>
    </div>
